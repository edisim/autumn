version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: autumn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: autumn
    volumes:
      - autumn_postgres:/var/lib/postgresql/data

  redis:
    image: valkey/valkey:8.0
    restart: unless-stopped

  autumn-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: edisim/autumn:coolify
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      PORT: 8080
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://autumn:${POSTGRES_PASSWORD}@postgres:5432/autumn
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    command: ["bun", "start"]

  autumn-workers:
    image: edisim/autumn:coolify
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://autumn:${POSTGRES_PASSWORD}@postgres:5432/autumn
    command: ["bun", "workers"]

volumes:
  autumn_postgres:
