version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: autumn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autumnpassword}
      POSTGRES_DB: autumn
    volumes:
      - autumn_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: valkey/valkey:latest
    restart: unless-stopped

  autumn-api:
    build: .
    command: pnpm start
    environment:
      DATABASE_URL: postgres://autumn:${POSTGRES_PASSWORD:-autumnpassword}@postgres:5432/autumn
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    ports:
      - "8080:8080"

  autumn-workers:
    build: .
    command: pnpm workers
    environment:
      DATABASE_URL: postgres://autumn:${POSTGRES_PASSWORD:-autumnpassword}@postgres:5432/autumn
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  autumn_postgres:
